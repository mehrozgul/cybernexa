<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07101e">
  <meta name="description" content="Sign in to CyberNexa — your cybersecurity and IT learning account.">
  <title>Login — CyberNexa</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 50 60'%3E%3Cpath d='M25 2 L46 10 V27 C46 42 37 52 25 58 C13 52 4 42 4 27 V10 Z' fill='none' stroke='%233b82f6' stroke-width='3'/%3E%3Crect x='18' y='25' width='14' height='14' rx='2' fill='none' stroke='%233b82f6' stroke-width='2.5'/%3E%3Cpath d='M20 25 V20 C20 16 30 16 30 20 V25' fill='none' stroke='%233b82f6' stroke-width='2.5'/%3E%3Ccircle cx='25' cy='31' r='2' fill='%233b82f6'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="stylesheet" href="../css/login.css">
</head>

<body class="auth-page">

  <main class="auth-container">
    <div class="auth-card">

      <!-- TOP BAR: BACK LINK -->
      <div class="auth-card-top">
        <a class="back-home" href="../index.html" aria-label="Return to CyberNexa home">
          <span aria-hidden="true">←</span> Back to Home
        </a>
      </div>

      <!-- CENTERED BRAND -->
      <div class="auth-brand-header">
        <a class="auth-brand" href="../index.html" aria-label="CyberNexa Home">
          <span class="auth-brand-logo">
            <svg viewBox="0 0 50 60" aria-hidden="true">
              <path d="M25 2 L46 10 V27 C46 42 37 52 25 58 C13 52 4 42 4 27 V10 Z" fill="none" stroke="currentColor" stroke-width="3.5" />
              <rect x="18" y="25" width="14" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2.5" />
              <path d="M20 25 V20 C20 16 30 16 30 20 V25" fill="none" stroke="currentColor" stroke-width="2.5" />
              <circle cx="25" cy="31" r="2" fill="currentColor" />
            </svg>
          </span>
          <span class="auth-brand-text">
            <strong>Cyber<span>Nexa</span></strong>
            <small>Cybersecurity &amp; IT Learning</small>
          </span>
        </a>
      </div>

      <!-- CARD HEADING -->
      <div class="form-heading text-center">
        <span class="form-eyebrow">SECURE PORTAL</span>
        <h1>Welcome <span>Back</span></h1>
        <p>Sign in to continue your cybersecurity learning journey</p>
      </div>

      <!-- LOGIN FORM -->
      <form class="auth-form" id="loginForm" novalidate>
        <div class="form-field">
          <label for="loginEmail">Email Address</label>
          <div class="input-wrap">
            <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="5" width="18" height="14" rx="2" />
              <path d="m4 7 8 6 8-6" />
            </svg>
            <input id="loginEmail" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
          </div>
          <small class="field-error" id="emailError"></small>
        </div>

        <div class="form-field">
          <div class="label-row">
            <label for="loginPassword">Password</label>
            <a href="forgot-password.html" class="forgot-link" id="forgotLink">Forgot password?</a>
          </div>
          <div class="input-wrap">
            <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="4" y="10" width="16" height="11" rx="2" />
              <path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3" />
            </svg>
            <input id="loginPassword" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
            <button class="password-toggle" type="button" aria-label="Show password" data-target="loginPassword">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" />
                <circle cx="12" cy="12" r="3" />
                <path class="eye-slash" d="M3 3 21 21" />
              </svg>
            </button>
          </div>
          <small class="field-error" id="passwordError"></small>
        </div>

        <div class="form-options">
          <label class="remember-option">
            <input type="checkbox" id="rememberMe" name="remember">
            <span class="custom-check"></span>
            <span>Remember me</span>
          </label>
        </div>

        <p class="form-message" id="loginMessage" aria-live="polite"></p>

        <button type="submit" class="primary-button cnx-btn-lg">
          <span>Sign In</span>
          <span class="button-arrow" aria-hidden="true">→</span>
        </button>
      </form>

      <!-- SOCIAL OAUTH OPTIONS -->
      <div class="auth-divider"><span>OR CONTINUE WITH</span></div>

      <div class="social-login" aria-label="Social sign-in options">
        <button type="button" class="social-button google" aria-label="Sign in with Google">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.8 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.4 9 5 12 5z" />
            <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.7-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z" />
            <path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3 0-.8.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 10.8 0 12.5s.7 2.8 1.9 5.2l3.7-2.9z" />
            <path fill="#34A853" d="M12 23.5c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.4-6.4-5.2L1.9 16.5C3.7 20.2 7.5 23.5 12 23.5z" />
          </svg>
        </button>
        <button type="button" class="social-button github" aria-label="Sign in with GitHub">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path d="M9 19c-4.5 1.5-4.5-2.5-6-3m12 6v-3.3a2.9 2.9 0 0 0-.8-2.3c2.7-.3 5.6-1.3 5.6-6A4.7 4.7 0 0 0 18.5 6a4.3 4.3 0 0 0-.1-3S17.4 2.7 15 4.3a12 12 0 0 0-6 0C6.6 2.7 5.6 3 5.6 3A4.3 4.3 0 0 0 5.5 6a4.7 4.7 0 0 0-1.3 3.4c0 4.7 2.9 5.7 5.6 6A2.9 2.9 0 0 0 9 17.7V22" />
          </svg>
        </button>
        <button type="button" class="social-button microsoft" aria-label="Sign in with Microsoft">
          <span class="microsoft-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        </button>
      </div>

      <!-- SWITCH TO SIGNUP -->
      <p class="switch-auth">
        Don't have an account? <a href="signup.html">Create Account</a>
      </p>

      <!-- SECURITY NOTE -->
      <div class="security-note">
        <span class="mini-shield">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M12 2 20 5v6c0 5-3.5 8.5-8 11-4.5-2.5-8-6-8-11V5l8-3Z" />
          </svg>
        </span>
        <span class="status-dot"></span>
        <span>256-Bit SSL Encrypted • Secure Session</span>
      </div>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/login.js"></script>
</body>

</html>
