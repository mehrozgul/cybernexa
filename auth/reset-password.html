<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07101e">
  <meta name="description" content="Set a new secure password for your CyberNexa student account.">
  <title>Reset Password — CyberNexa</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 50 60'%3E%3Cpath d='M25 2 L46 10 V27 C46 42 37 52 25 58 C13 52 4 42 4 27 V10 Z' fill='none' stroke='%233b82f6' stroke-width='3'/%3E%3Crect x='18' y='25' width='14' height='14' rx='2' fill='none' stroke='%233b82f6' stroke-width='2.5'/%3E%3Cpath d='M20 25 V20 C20 16 30 16 30 20 V25' fill='none' stroke='%233b82f6' stroke-width='2.5'/%3E%3Ccircle cx='25' cy='31' r='2' fill='%233b82f6'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>

<body class="auth-page">

  <main class="auth-container">
    <div class="auth-card">

      <!-- TOP BAR: BACK LINK -->
      <div class="auth-card-top">
        <a class="back-home" href="login.html" aria-label="Return to Sign In">
          <span aria-hidden="true">←</span> Back to Sign In
        </a>
      </div>

      <!-- CENTERED BRAND -->
      <div class="auth-brand-header">
        <a class="auth-brand" href="../index.html" aria-label="CyberNexa Home">
          <span class="auth-brand-logo">
            <svg viewBox="0 0 50 60" aria-hidden="true">
              <path d="M25 2 L46 10 V27 C46 42 37 52 25 58 C13 52 4 42 4 27 V10 Z" fill="none" stroke="currentColor" stroke-width="3.5" />
              <rect x="18" y="25" width="14" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2.5" />
              <path d="M20 25 V20 C20 16 30 16 30 20 V25' fill='none' stroke='currentColor' stroke-width='2.5' />
              <circle cx="25" cy="31" r="2" fill="currentColor" />
            </svg>
          </span>
          <span class="auth-brand-text">
            <strong>Cyber<span>Nexa</span></strong>
            <small>Cybersecurity &amp; IT Learning</small>
          </span>
        </a>
      </div>

      <!-- CARD HEADING -->
      <div class="form-heading text-center">
        <span class="form-eyebrow">CREDENTIAL UPDATE</span>
        <h1>Reset <span>Password</span></h1>
        <p>Choose a strong new password for your CyberNexa account.</p>
      </div>

      <!-- RESET PASSWORD FORM -->
      <form class="auth-form" id="newPasswordForm" novalidate>
        <div class="form-field">
          <label for="newPassword">New Password</label>
          <div class="input-wrap">
            <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="4" y="10" width="16" height="11" rx="2" />
              <path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3" />
            </svg>
            <input id="newPassword" name="password" type="password" placeholder="Create new password (min 8 chars)" autocomplete="new-password" required>
            <button class="password-toggle" type="button" aria-label="Show password" data-target="newPassword">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" />
                <circle cx="12" cy="12" r="3" />
                <path class="eye-slash" d="M3 3 21 21" />
              </svg>
            </button>
          </div>
          <small class="field-error" id="newPasswordError"></small>
        </div>

        <div class="form-field">
          <label for="confirmNewPassword">Confirm New Password</label>
          <div class="input-wrap">
            <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="4" y="10" width="16" height="11" rx="2" />
              <path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3" />
            </svg>
            <input id="confirmNewPassword" name="confirmPassword" type="password" placeholder="Confirm new password" autocomplete="new-password" required>
            <button class="password-toggle" type="button" aria-label="Show password" data-target="confirmNewPassword">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" />
                <circle cx="12" cy="12" r="3" />
                <path class="eye-slash" d="M3 3 21 21" />
              </svg>
            </button>
          </div>
          <small class="field-error" id="confirmNewPasswordError"></small>
        </div>

        <p class="form-message" id="resetMessage" aria-live="polite"></p>

        <button type="submit" class="primary-button cnx-btn-lg">
          <span>Update Password</span>
          <span class="button-arrow" aria-hidden="true">→</span>
        </button>
      </form>

      <!-- SWITCH TO LOGIN -->
      <p class="switch-auth">
        Back to <a href="login.html">Sign In</a>
      </p>

      <!-- SECURITY NOTE -->
      <div class="security-note">
        <span class="mini-shield">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M12 2 20 5v6c0 5-3.5 8.5-8 11-4.5-2.5-8-6-8-11V5l8-3Z" />
          </svg>
        </span>
        <span class="status-dot"></span>
        <span>Secure HTTPS Connection</span>
      </div>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/reset-password.js"></script>
</body>

</html>
