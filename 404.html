    <style>
        *, *::before, *::after {

        body {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

        }

        .brand-badge {
            display: inline-flex;

            gap: 8px;
            margin-bottom: 24px;
            padding: 6px 14px;

            border-radius: 999px;
            color: #93c5fd;
            font-size: 13px;
            font-weight: 600;

            transition: background 0.15s ease, border-color 0.15s ease;

        }

        .brand-badge svg {

        }

        .error-code {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;

        .error-code span {

        }

        h1 {
            font-size: clamp(22px, 4vw, 28px);

            color: #f1f5f9;
            margin-bottom: 12px;
            letter-spacing: -0.3px;
        }

        p {
            color: #94a3b8;
            font-size: 15px;
            line-height: 1.6;
            max-width: 460px;
            margin: 0 auto 32px;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 44px;
            padding: 0 24px;
            background: #2563eb;
            color: #ffffff;
            border: 1px solid #2563eb;
            border-radius: 6px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.15s ease, border-color 0.15s ease;
        }

        .btn-primary:hover {
            background: #1d4ed8;
            border-color: #1d4ed8;
        }

        .btn-secondary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 44px;
            padding: 0 24px;
            background: transparent;
            color: #cbd5e1;
            border: 1px solid rgba(255, 255, 255, 0.14);

            font-size: 14px;

        .btn-secondary:hover {

        .terminal-hint {
            margin-top: 40px;

            background: #0d1521;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 13px;
            color: #94a3b8;
            max-width: 420px;
            width: 100%;
            text-align: left;
            line-height: 1.6;
        }

        .terminal-hint .t-prompt {
            color: #4ade80;
        }

        .terminal-hint .t-cmd {
            color: #93c5fd;
        }

        .terminal-hint .t-out {
            color: #64748b;
            display: block;
            padding-left: 14px;
            margin-top: 4px;
        }

        .terminal-hint a {
            color: #93c5fd;
            text-decoration: none;
        }

        .terminal-hint a:hover {
            text-decoration: underline;
        }

</head>

<body>

    <a href="index.html" class="brand-badge" id="brandLink">
        <svg viewBox="0 0 50 60" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true">
            <path d="M25 2 L46 10 V27 C46 42 37 52 25 58 C13 52 4 42 4 27 V10 Z"/>
            <rect x="18" y="25" width="14" height="14" rx="2" stroke-width="2.5"/>

        </svg>
        <span>CyberNexa Platform</span>
    </a>

    <div class="error-code"><span>4</span>0<span>4</span></div>

    <h1>Page Not Found</h1>

    <p>
        The page you are looking for may have been moved, renamed,
        or does not exist. Use the links below to return to safety.
    </p>

    <div class="btn-group">
        <a href="index.html" class="btn-primary" id="homeBtn">Back to Home</a>
        <a href="learning-paths/labs/practical-labs.html" class="btn-secondary" id="labsBtn">Browse Labs</a>
    </div>

    <div class="terminal-hint" role="complementary" aria-label="Quick directory links">
        <div><span class="t-prompt">$ </span><span class="t-cmd">cybernexa</span> --status 404</div>
        <span class="t-out">→ <a href="index.html" id="quickHome">Home Page</a></span>
        <span class="t-out">→ <a href="index.html#learning" id="quickPaths">Learning Paths</a></span>
        <span class="t-out">→ <a href="index.html#tutorials" id="quickTutorials">Latest Tutorials</a></span>
        <span class="t-out">→ <a href="footer/contact.html" id="quickContact">Contact Support</a></span>
    </div>

    <script>
        (function() {
            // Automatically adjust links if hosted in a GitHub Pages subpath repository
            const pathname = window.location.pathname;
            const segments = pathname.split("/").filter(Boolean);
            
            // Check if first segment is the repo name (e.g. CyberNexa or cybernexa)
            let basePath = "/";
            if (segments.length > 0 && segments[0].toLowerCase() === "cybernexa") {
                basePath = "/" + segments[0] + "/";
            }

            const links = {
                brandLink: basePath + "index.html",
                homeBtn: basePath + "index.html",
                labsBtn: basePath + "learning-paths/labs/practical-labs.html",
                quickHome: basePath + "index.html",
                quickPaths: basePath + "index.html#learning",
                quickTutorials: basePath + "index.html#tutorials",
                quickContact: basePath + "footer/contact.html"
            };

            for (const [id, url] of Object.entries(links)) {
                const el = document.getElementById(id);
                if (el) {
                    el.href = url;
                }
            }
        })();
    </script>
